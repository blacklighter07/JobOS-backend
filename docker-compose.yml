services:
  job-os-backend:
    build: 
      context: . 
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    env_file:
      - .env 
    environment:
      - PORT=5000
      - NODE_ENV=production
      - BASE_URL=${BASE_URL:-http://localhost:5001}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./uploads:/app/uploads

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password

  redis:
   image: redis:latest
   ports:
     - "6379:6379"
   command: redis-server --appendonly yes
   volumes:
     - redis_data:/data

